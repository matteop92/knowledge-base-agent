[project]
name = "knowledge-agent"
version = "0.1.0"
description = "Personal knowledge agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "psycopg[binary]>=3.3,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
