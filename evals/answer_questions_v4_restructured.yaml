# A concrete tactic described in the source counts as an example for Q4.E1 and Q5.E1.
# Shared-platform integration (former Q1.C10) is not distinctive or unusual and is not a check.
# Q1.C7 and Q1.C8 are optional details: useful follow-up content, never scored.
# Q6.C10 (stating what was observed when asking) is removed as not needed.
# Q8.C4 (question-led feedback) and Q8.C11 (preserving ownership) were removed by the user on
# 2026-10-15: they are about managing people after hiring, which the question does not ask.
