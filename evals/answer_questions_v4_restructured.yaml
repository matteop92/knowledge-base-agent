# Frozen on 2026-10-15 with every question approved by the user.
# Applicable checks use pass/fail; unreviewed remains unreviewed.
# Coverage tests inclusion. Incorrect attribution/support is judged under grounding.
# Details are N/A when their primary is absent; they are not failed in that case.
# Optional = useful extra content, not needed for a complete answer. Omission is
# N/A; if included, assess pass/fail separately. Optional checks never enter the
# scored numerator or denominator and earn no bonus. Their details also require
# their parent to pass. Claims about optional content still undergo grounding.
# Count one grounding error once, under its most specific check; do not also
# penalize that same error under the general factual-support check.
# Q1.C2 remains an independent primary: developing people is distinct from hiring criteria.
# Q3.E1 accepts concrete source examples tied explicitly to the homepage advice.
