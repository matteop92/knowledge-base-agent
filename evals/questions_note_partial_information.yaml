source_title: How to make decisions with partial information
questions:
- id: overanalysis_cost
  question: Why does the note say overanalysis can be worse than laziness?
  expected: supported
  must_find:
  - start_char: 211
    end_char: 355
    quote: Overanalysis has been my life story. It can be far worse than laziness, as overanalysis leads
      to the same lack of action but ALSO self-loathing.
- id: decision_deadline
  question: What is the first step suggested for overcoming paralysis by analysis?
  expected: supported
  must_find:
  - start_char: 524
    end_char: 564
    quote: Step one is set deadlines for decisions.
  - start_char: 783
    end_char: 911
    quote: So I set deadlines. By X point in time, I must make a go or no-go decision, no matter how much
      or how little information I have.
- id: small_experiments
  question: How does the writer make a go decision feel less risky?
  expected: supported
  must_find:
  - start_char: 912
    end_char: 1060
    quote: Furthermore, I try and figure out small, short-term, low-risk experiments I can run as "go"
      decisions, so that I don't perceive action as high-risk.
- id: deadline_date
  question: What calendar date did the writer set for the next decision?
  expected: unsupported
