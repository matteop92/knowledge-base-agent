source_title: 'The Tim Ferriss Show Transcripts: How to Teach a 3-Year-Old to Read and Rethinking Education
  — Tim Coaches Niels Hoven of Mentava (#882)'
questions:
- id: mentava_channels
  question: Which channels bring Mentava its best customers, and why does Niels think they work?
  expected: supported
  must_find:
  - start_char: 57431
    end_char: 57712
    quote: I think our best customers are X, and word of mouth. And I think the reason for both of those
      is that our message gets in front of people who are receptive to hearing it. I would say that a
      big part of our struggle is top of funnel. How do we raise awareness with the right people?
  - start_char: 58068
    end_char: 58524
    quote: 'I think people hear that and believe in the mission and because it’s hard to make sophisticated
      product decisions about these nuanced products, they hear the mission and they’re like, okay, this
      is a company that believes in a mission of very accelerated learning, which is something that I
      believe in too, that I don’t hear a lot of people talking about.


      I’m at least willing to go out and try their software. And I think that’s why we get people from
      X.'
- id: trial_purpose
  question: Why does Mentava offer a 14-day free trial?
  expected: supported
  must_find:
  - start_char: 32099
    end_char: 32454
    quote: Okay. So the point of the 14-day free trial is that we know we are not good at explaining what
      differentiates our software. We think what works best is just get it in the hands of the customer
      and let them try. So I think within 14 days, we think that’s enough time that a customer can figure
      out if this is going to be a good fit for their family or not.
  - start_char: 32456
    end_char: 32659
    quote: A very common problem is exactly what happened with Jake where he has a kid who is probably
      not developmentally ready to learn to read. And so we want the parents to recognize that during
      the free trial.
- id: referral_incentive
  question: What happened when Mentava offered free months for customer referrals?
  expected: supported
  must_find:
  - start_char: 63971
    end_char: 64232
    quote: I believe we did as big as, if your friend signs up, we will give them a free month and we
      will give you a free month. So that’s basically, that’s $1,000 user acquisition cost. And we sent
      out coupon codes to our entire customer base, and we got zero referrals.
  - start_char: 64233
    end_char: 64553
    quote: Even though we know that customers are actively referring friends, we have a lot of people
      who sign up. I do an intro call with almost every customer who comes on board. And so we know that
      a lot of people came because they saw their friend use it through word of mouth, but the incentives
      didn’t drive, they drove zero.
  useful: []
- id: selective_word_of_mouth
  question: What makes parents reluctant or selective about recommending Mentava to friends?
  expected: supported
  must_find:
  - start_char: 62966
    end_char: 63302
    quote: Going from there to word of mouth, we have a lot of parents say to us that they tell their
      friends about it. There’s some reluctance to tell their friends about it, because there’s a certain
      amount of shame around using a $500 a month app. There’s this sort of cultural shame around using
      your resources to allow your kids to get ahead.
  - start_char: 65544
    end_char: 65906
    quote: What I’ve heard from the people who do refer their friends is that they’re very selective about
      who they mention it to. They have specific ideas about which of their friends would be receptive,
      and they tell those friends about it. And my theory is that they tell those friends about it anyway
      to help their friends out, and the $500 is not a driver of behavior.
- id: investor_asks
  question: How does Tim suggest founders use investor updates to get more help?
  expected: supported
  must_find:
  - start_char: 55762
    end_char: 56152
    quote: The reason I mentioned that is that I get probably 10 to 20 investor updates, a month. And
      some of them are super long, yours are not super long. But if you have investor asks, I would put
      them at the very top. I would skip all the updates. I would skip all of the numbers. I would skip
      the runway. I would skip the new hires. I shouldn’t say skip. I would defer. I would put it lower
      down.
  - start_char: 56318
    end_char: 56557
    quote: But the vast majority, I don’t have voting rights. So the only way that I can really impart
      influence is by trying to be helpful, but I also am in an inbox with a million other things. So
      having the asks at the very top will get more help.
  useful: []
- id: personal_intro_calls
  question: What direct contact does Niels have with new customers?
  expected: supported
  must_find:
  - start_char: 64337
    end_char: 64502
    quote: I do an intro call with almost every customer who comes on board. And so we know that a lot
      of people came because they saw their friend use it through word of mouth
- id: product_opportunity
  question: What did conversations with other parents teach Niels about the product opportunity?
  expected: supported
  must_find:
  - start_char: 8590
    end_char: 9339
    quote: And so, other parents noticed what I was doing. They asked me questions about it. I pointed
      them to the same software, and some of them had some success and some of them didn’t. And really
      what I realized as all of this was going on was that the problem was in the design of the software.
      No one is designing software for three and four-year-olds to be learning on their own. It’s not
      that it’s impossible, it’s just that it’s really, really hard. But my background is in games. I
      spent a long time designing games and designing tutorials, and it’s just design problems all the
      way down. I felt like this is a problem that I could solve, that I wanted to solve for myself, that
      I wanted to solve for other people, and that’s where Mentava came from.
- id: first_twenty_cold_outreach
  question: Does this episode document a founder winning their first 20 customers through quantified cold
    outreach?
  expected: unsupported
  must_find: []
  note: Cold email is mentioned for pitching conference organizers, but no quantified first-20-customer
    case is given.
- id: tim_conversion_recommendations
  question: What did Tim Ferriss recommend the founder change to improve conversion and signups?
  kind: multi_section_synthesis
  expected: supported
  must_find:
  - start_char: 14056
    end_char: 14387
    quote: This phrasing, unusually fast learners, I would actually just scrap unusually and go straight
      to fast learners. Part of the reason for that is that when I saw this on the website, I was like,
      “Well, what is unusually fast?” Even if I consider my kid fast, maybe unusually fast is what, 1
      out of 100? 1 out of 1,000? And I stumbled.
  - start_char: 40319
    end_char: 40491
    quote: Is there any reason to have people sign up and then do the readiness check as opposed to do
      an abbreviated readiness check, a two-minute, “Is your kid ready?” type of quiz?
  - start_char: 41033
    end_char: 41628
    quote: 'I really think that selling the parents relief, not just the kid’s speed is a big deal, that
      you don’t have to be the teacher because the 500 can be anchored in a few different ways. $500 a
      month. Is it the same or is it less than a tutor? Well, let’s just say it’s the same.


      And let’s say they’re equally effective, but there’s one difference. And one is you’re giving a
      kid a fish, meaning the teacher is motivating the kid versus you’re teaching the kid to fish, meaning
      the kid is becoming a self-motivated, self-directed learner, then Mentava still wins, even if they’re
      equally effective.'
  - start_char: 84156
    end_char: 84369
    quote: So the testimonials, I would 100% test having the testimonials very prominent. And just looking
      at your homepage as a print advertisement effectively, you want to have a clean visual progression
      through the piece.
  useful:
  - start_char: 78951
    end_char: 79216
    quote: So instead of get started in the top right, which is that button, and I still, well, it’s replicated
      in another place on the homepage, but it’s, “Is my child ready?” Instead of get started, maybe it
      helps, maybe it doesn’t. Something that’s very easy to split test.
  - start_char: 102160
    end_char: 102369
    quote: I mean, for instance, with some of these mock-ups or if you’re testing copy options, I think
      it’s most valuable if it’s on your own website because you control it and you can try to discern
      intent to purchase.
  answer_rubric:
    required_points:
    - Sharpen who the product is for and simplify the positioning language.
    - Explore a short readiness check before signup and a clearer readiness call to action.
    - Frame the benefit for parents, including relief from acting as the teacher.
    - Put strong customer testimonials near the front of the website.
    calibration: Present these as Tim's recommendations or experiments, not measured conversion gains.
