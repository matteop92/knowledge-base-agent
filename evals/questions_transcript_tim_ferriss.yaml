      helps, maybe it doesn’t. Something that’s very easy to split test.
- id: tim_message_testing
  question: How did Tim suggest Mentava find and test language that converts?
  kind: focused_diagnostic
  expected: supported
  must_find:
  - start_char: 98971
    end_char: 99564
    quote: Because sure, you can get feedback that is measurable in the forms of clicks and so on, and
      you can use user testing and see how people are reacting to a website, which I think is interesting.
      If you have a webcam on, you can look at their face and where they pause, which is not going to
      be transmitted if you’re only getting click-through data or click data in the case of a heat map,
      let’s say. But when you’re talking to people in person and trying to explain what you do, it’s like,
      do they lean in or do they lean back? Do they follow up with a question or they’re like, oh, interesting.
  - start_char: 102160
    end_char: 102369
    quote: I mean, for instance, with some of these mock-ups or if you’re testing copy options, I think
      it’s most valuable if it’s on your own website because you control it and you can try to discern
      intent to purchase.
  useful:
  - start_char: 100066
    end_char: 100404
    quote: Or if you give them a paragraph and then two or three people at a bar, you’re just having casual
      conversations with at an event, they all ask about the same little thing that you’ve been discounting
      that has been a minor cameo in your messaging as opposed to the leading headline. And you’re like,
      you know what? Maybe I should test that.
  - start_char: 104696
    end_char: 104967
    quote: But these are all different tentacles that are all out probing that bring information back
      to the central brain that then determines which I want to split test in a place with higher stakes,
      but better signaling for purchase intention, which would be your website, right?
