questions:
- id: Q1
  review_status: pending
  question: What are the unusual principles Bending Spoons uses to grow and work on the different products?
  purpose: Understand the company's distinctive operating system across products.
  answerability: full
  sources:
  - bending_spoons
  essential_facets:
  - Favor talent and drive over experience, then create conditions for autonomy and growth.
  - Enable great people to do great work as they see fit, with as few rigid rules and processes as the work
    allows.
  - Centralize talent decisions to reduce local hiring pressure and learn across roles.
  - Avoid variable pay tied to narrow KPIs; trust intrinsically motivated managers to build strong teams instead.
  - Saturate promising employees' capacity by giving them more work than they can comfortably complete, so
    they must prioritize and grow.
  - Relentlessly simplify; require those proposing added complexity to justify it, and actively remove existing
    complexity.
  - Treat acquired businesses as long-term operating products, not assets bought to resell.
  - Explain how ownership and small teams support work across products.
  suggested_examples:
  - Eliminating internal titles
  - rotating people across products
  - internal AI tools
  - Evernote
  alternative_evidence: Any original transcript passages that support each principle and its operating context.
  qualifications: Separate Ferrari's stated practices from the interviewer's framing; do not imply every product
    uses identical tactics.
  prohibited_inferences:
  - Specific acquisition prices or unspoken financial returns
  - universal success of every practice
  useful_answer: Organize distinct principles, explain why they matter, and illustrate how they apply across
    products.
