- id: Q3
  review_status: pending
  question: What copy advice would Tim Ferriss give me to maximize impact of my company's homepage?
  purpose: Improve homepage messaging and test it with an audience.
  answerability: full
  sources:
  - ferriss
  essential_facets:
  - Lead with the audience's concrete benefit or relief, and explain it with Tim's Mentava example of selling
    parents relief from teaching or nagging alongside faster learning for children.
  - Put credible testimonials and proof prominently where visitors first look.
  - Make the call to action specific and reduce friction in the path to trying the product.
  - Test language in person through conversations and presentations; notice what prompts questions or interest,
    then test promising wording on the website using purchase-intent signals.
  suggested_examples:
  - Mentava parent relief
  - readiness-check CTA
  - homepage visual flow
  - informal conversation tests
  alternative_evidence: Other original Tim Ferriss passages from the same transcript supporting equivalent
    advice.
  qualifications: Distinguish Tim's advice from Niels Hoven's product facts; adapt examples to the user's unknown
    business.
  prohibited_inferences:
  - A guaranteed conversion lift
  - invented testimonials
  - treating a mock-up's unverified claim as fact
  useful_answer: Give prioritized, testable homepage changes; make the advice concrete with Tim's examples
    from coaching Mentava's Niels Hoven, and explain how in-person conversations and presentations can uncover
    better wording.
