- id: Q2
  review_status: pending
  question: I am starting a new business project and I need help from Derek Sivers. What ideas or prompts would
    he suggest considering to challenge or stretch my thinking about how to build the business?
  purpose: Turn Sivers' highlighted ideas into questions for a new project.
  answerability: full
  sources:
  - sivers
  essential_facets:
  - Put time into ideas that get a strong public response, including people wanting to pay; if the response
    is lukewarm, improve, invent, or move on rather than keep pushing the same idea.
  - Make decisions for the benefit of customers; when priorities are unclear, ask how you can best help them
    now and act on their requests.
  - Question whether supposedly necessary corporate formalities actually serve the business; Sivers describes
    refusing employee review plans and other formalities at CD Baby, while pointing to businesses that work
    without them.
  - Choose whom the business is for, confidently exclude others, and clearly say what it is not.
  suggested_examples:
  - Jim's Fish Bait Shop as an example of a business without corporate formalities
  - CD Baby excluding record labels
  - CD Baby special favors
  - designing for twice the current volume
  alternative_evidence: Any highlighted source passage supporting an equivalent prompt.
  qualifications: Identify reader-added notes separately from Sivers' words; a non-hit can merit improvement
    before abandonment. His rejection of corporate formalities is a business-design challenge, not a claim
    that legal obligations can be ignored.
  prohibited_inferences:
  - Claims that Sivers personally assessed the user's project
  - claims that every idea should be abandoned immediately
  - claims that all formalities or legal obligations are unnecessary
  useful_answer: Offer concrete questions or prompts that challenge the user's assumptions and open up different
    ways to think about the business; explain them with source examples and distinguish Sivers' ideas from
    adapted prompts.
