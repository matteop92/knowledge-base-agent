- id: Q4
  review_status: pending
  question: What steps could I take to calm myself down when I realize I feel anger?
  purpose: Get an immediately usable sequence from the short note.
  answerability: full
  sources:
  - anger
  essential_facets:
  - Notice the note's warning signs, including pointing your fist, raising your voice, heavy breathing, flaring
    nostrils, and head shaking.
  - Drop the heavy breathing when you notice anger, label the reaction as weakness as the note suggests, detach
    from it, and take a breath to regain control.
  - Nod slowly to buy time, consider the next move, and count down if needed.
  suggested_examples:
  - Raised voice
  - clenched or pointing fist
  - flared nostrils
  alternative_evidence: Any original note span covering the same steps.
  qualifications: Present these as the note's tactics, not a clinical treatment.
  prohibited_inferences:
  - A claim that these steps always prevent anger
  - an invented study
  useful_answer: Supply a short sequence usable in the moment.
